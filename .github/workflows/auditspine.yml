name: AuditSpine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          go mod tidy || echo "No go.mod, skipping"
          npm install || echo "No package.json, skipping"

      - name: Run Drift Check
        run: |
          chmod +x scripts/drift-check.sh
          ./scripts/drift-check.sh

      - name: Archive Drift Result
        uses: actions/upload-artifact@v4
        with:
          name: drift-check-result
          path: drift_check_result.yaml
